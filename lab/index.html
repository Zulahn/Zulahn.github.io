<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasientjournal - Lab</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="css/lab.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/" class="back-link">← Tilbake</a>
      <h1>Pasientjournal</h1>
    </div>
    <span class="status">Proof of Concept</span>
  </header>

  <main>
    <!-- Left: Documents Panel -->
    <aside class="documents-panel">
      <div class="patient-selector">
        <select id="patient-select" onchange="selectPatientFromDropdown()">
          <option value="">Velg pasient...</option>
        </select>
        <button class="generate-btn" onclick="generatePatient()">+ Generer</button>
      </div>
      <div class="documents-header">
        <h2>Dokumenter</h2>
      </div>
      <div class="document-list">
        <div id="documents-list">
          <p style="font-size: 0.8rem; color: #999; padding: 1rem;">Velg en pasient</p>
        </div>
      </div>
    </aside>

    <!-- Middle: Document Viewer -->
    <div class="document-viewer">
      <div id="viewer-content">
        <div class="viewer-empty">
          <h2>Pasientjournal</h2>
          <p>Velg et dokument for å se innholdet</p>
        </div>
      </div>
    </div>

    <!-- Right: Chat -->
    <div class="chat-container">
      <div class="chat-messages" id="chat-messages">
        <div class="welcome-message">
          <h2>Pasientjournal</h2>
          <p>Spør om helsedata, journaldokumenter eller generer syntetiske pasienter.</p>
          <p style="margin-top: 0.5rem; font-size: 0.875rem;">Prøv: "Vis alle epikriser" eller "Hvilke dokumenter har Kari Hansen?"</p>
        </div>
      </div>

      <div class="chat-input-container">
        <div class="chat-input-wrapper">
          <input
            type="text"
            id="chat-input"
            placeholder="Spør om pasientjournaler..."
            autocomplete="off"
          >
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
