  <style>
    .site-header nav {
      max-width: 1000px;
      padding: 0 8px;
    }

    h1, h2 { color: var(--creative-heading); }

    .intro,
    .image-count {
      color: var(--creative-accent);
      padding-left: 8px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--spacing-xl) 0;
    }

    h1 {
      font-size: var(--font-size-3xl);
      margin-bottom: var(--spacing-sm);
      padding-left: 8px;
    }

    h2 {
      font-size: var(--font-size-xl);
      padding-left: 8px;
      margin-top: var(--spacing-2xl);
      margin-bottom: var(--spacing-xs);
    }

    .section-count {
      color: var(--creative-accent);
      padding-left: 8px;
      margin-bottom: var(--spacing-sm);
    }

    /* W3Schools Responsive Image Grid */
    .row {
      display: flex;
      flex-wrap: wrap;
      padding: 0 4px;
    }

    .column {
      flex: 25%;
      max-width: 25%;
      padding: 0 4px;
    }

    .column img {
      margin-top: 8px;
      vertical-align: middle;
      width: 100%;
    }

    @media screen and (max-width: 800px) {
      .column {
        flex: 50%;
        max-width: 50%;
      }
    }

    @media screen and (max-width: 600px) {
      .column {
        flex: 100%;
        max-width: 100%;
      }
    }
  </style>
