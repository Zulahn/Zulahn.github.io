<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualize my file structure</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="css/tools.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="/" class="back-link">&larr; Home</a>
    </nav>
  </header>

  <main class="main-content">
    <section class="hero">
      <h1>Visualize my file structure</h1>
      <p>Quickly illustrate and share your file structure</p>
    </section>

    <div id="drop-zone" class="drop-zone">
      <div class="drop-zone-icon">📁</div>
      <div class="drop-zone-text">
        <strong>Drop a folder here to generate</strong>
        or click to select
      </div>
      <input type="file" id="file-input" webkitdirectory directory multiple>
    </div>

    <section id="output-section" class="output-section">
      <div class="output-header">
        <div class="output-left">
          <div class="toggle-container">
            <span class="toggle-label">Simple</span>
            <label class="toggle-switch">
              <input type="checkbox" id="view-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label">Full</span>
          </div>
          <span id="output-info" class="output-info"></span>
        </div>
        <button id="copy-btn" class="copy-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          Copy to clipboard
        </button>
      </div>
      <pre id="output-box" class="output-box" tabindex="0"></pre>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 &middot; <a href="/">Back to portfolio</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
